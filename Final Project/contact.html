<body>
  
  <header>
    <div class="logo">
      <a href="index.html">
        <img src="image/logo.png" alt="Strawberry Icon">
      </a>

    <div class="menu-toggle">
            <span></span>

      </ul>
    </nav>
  </header>

  
  <section class="reservation">
    <h2>Come Dine with us</h2>
    <form action="" method="post" class="reservation-form">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <input type="date" name="date" required>
      <input type="time" name="time" required>
      <input type="number" name="guests" placeholder="Number of Guests" min="1" required>
      <button type="submit">Reserve Now</button>
    </form>
  </section>

  
  <section class="contact-info">
    <h2>Contact us</h2>
    <div class="info-container">
      <div class="info-left">
        <h3>Visit us</h3>
        <p>123 Sakura Street<br>Tokyo, Japan 100-0001</p>
        <p><strong>Phone:</strong> +81-3-1234-5678</p>
        <p><strong>Email:</strong> info@ichigonoumi.jp</p>
        <div class="socials">
          <p><a href="https://www.facebook.com" target="_blank"><img src="image/facebook.png" alt="Facebook">Facebook</a></p>
          <p><a href="https://www.instagram.com" target="_blank"><img src="image/instagram.png" alt="Instagram">Instagram</a></p>
        </div>
      </div>
      <div class="info-right">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3866.2615533281487!2d121.04680431153967!3d14.296229986097119!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397d75e81d601ff%3A0x82706982cf189f45!2sAbdulkarim%20Aesthetic%20and%20Laser%20Centre!5e0!3m2!1sen!2sph!4v1760761683099!5m2!1sen!2sph" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" alt="Tokyo" class="map"></iframe>
        <img src="image/Street.png" alt="Street View" class="street">
      </div>
    </div>
  </section>
