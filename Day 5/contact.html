<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto no Umi</title>
  <link rel="stylesheet" href="">
</head>
<body>
  
  <header>
    <div class="logo">
      <img src="image/logo.png" alt="Strawberry Icon">
    </div>
    <nav class="nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  
  <section class="reservation">
    <h2>Come Dine with us</h2>
    <form action="" method="post" class="reservation-form">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <input type="date" name="date" required>
      <input type="time" name="time" required>
      <input type="number" name="guests" placeholder="Number of Guests" min="1" required>
      <button type="submit">Reserve Now</button>
    </form>
  </section>

  
  <section class="contact-info">
    <h2>Contact us</h2>
    <div class="info-container">
      <div class="info-left">
        <h3>Visit us</h3>
        <p>123 Sakura Street<br>Tokyo, Japan 100-0001</p>
        <p><strong>Phone:</strong> +81-3-1234-5678</p>
        <p><strong>Email:</strong> info@ichigonoumi.jp</p>
        <div class="socials">
          <p><a href="image/facebook.png">Facebook</a></p>
          <p><a href="image/instagram.png">Instagram</a></p>
        </div>
      </div>
      <div class="info-right">
        <img src="image/Map.png" alt="Tokyo" class="map">
        <img src="image/Street.png" alt="Street View" class="street">
      </div>
    </div>
  </section>

  
  <footer>
    <p>&copy; 2025 Ichigo Japanese Cuisine. All rights reserved. Savor the Strawberry Flavor.</p>
  </footer>
</body>
</html>
